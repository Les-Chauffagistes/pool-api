openapi: 3.0.0
info:
  title: Les Chauffagistes mining pool API
  version: 1.0.0
  description: API Les Chauffagistes pour accéder aux métriques de minage
tags:
  - name: health
  - name: pool

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
  /v1/pool:
    get:
      operationId: getPool
      tags: [pool]
      summary: Pool metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/Pool"
  /v1/node:
    get:
      operationId: getNode
      tags: [pool]
      summary: Node metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/Node"
  /v1/stats/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUserStats
      tags: [pool]
      summary: User stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolStats"
        "404":
          description: Adresse introuvable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: Adresse introuvable
  /v1/top:
    get:
      operationId: getTop
      tags: [pool]
      summary: Top metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolTop"
  /v1/pings:
    get:
      operationId: getPings
      tags: [pool]
      summary: Ping metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolPing"
  /v1/data:
    get:
      operationId: getData
      tags: [pool]
      summary: Data metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolApiDataPayload"
  /v1/monthlyBests:
    get:
      operationId: getMonthlyBests
      tags: [pool]
      summary: Monthly bests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolPrivateBestRecord"
  /v1/hashrate:
    get:
      operationId: getHashrate
      tags: [pool]
      summary: Hashrate history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolHashrateRecord"
  /v1/distribution/{address}:
    get:
      operationId: getDistribution
      summary: Distribution of shares for an address
      tags: [pool]
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolDistributionElement"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

# Routes WebSocket: le générateur ne sait pas les déclarer. Elles sont branchées à la main
# (impl/v1/handlers/share_stream.py, incluse dans main.py) et décrites ici, sous une extension
# racine que le générateur ignore.
x-websocket-routes:
  /v1/shares/stream:
    summary: Flux des shares (WebSocket, au moins une fois, avec reprise)
    description: |
      Diffuse les shares de share_log. Messages serveur: JSON texte, un événement par message.
      Le client n'envoie rien (ignoré).

      Query `from=<epoch>:<seq>` (optionnel): le serveur rejoue depuis la base les shares strictement
      postérieurs à ce curseur (ordre lexicographique epoch puis seq), puis bascule en live.
      Sans `from`, le flux démarre au présent (pas de replay). `1:0` = tout l'historique retenu.
      Filtres (optionnels, cumulables): `address` (= `username` du share) et `workername`. Comparaison
      exacte: `address` est sensible à la casse (adresses base58), `workername` ne l'est pas; avec les deux,
      les deux doivent correspondre. Le filtrage est fait côté serveur,
      y compris pendant le replay: seuls les shares correspondants sont envoyés (`hello`, `watermark`
      et `heartbeat` restent envoyés). Un share `parse_error` (champs nuls) ne correspond à aucun filtre.
      Une valeur vide est refusée (4400). Le curseur de reprise reste valable avec le même filtre.

      Le curseur de reprise est (epoch, seq) du dernier share reçu. Livraison au moins une fois: après
      reprise ou changement d'epoch (failover Postgres) un share peut être renvoyé; dédupliquer sur `share_id`.

      Événements (champ `type`):
      - `hello`: `cursor` (point de départ) et `head` (dernier curseur attribué), au format `epoch:seq`.
      - `share`: `share_id` (`instance:path:byte_offset`, clé d'idempotence), `epoch`, `seq`, `instance`,
        `created_at`, `workinfoid`, `block_height` (entier, hauteur du bloc; `null` si le path est inattendu), `username`, `workername`, `diff`, `sdiff`, `result`, `parse_error`.
        Un share illisible côté exporteur est envoyé avec `parse_error: true` et les champs nuls
        (le seq reste ainsi continu); `raw` n'est jamais exposé.
      - `watermark`: tout share de toute instance active avec `created_at` <= watermark a déjà été
        envoyé. Minimum des `shipped_until` des instances ayant émis un heartbeat récemment; jamais en recul.
      - `heartbeat`: toutes les ~15 s. Champ `cursor` (`epoch:seq`, présent quand aucun share n'est en attente
        d'envoi): dernier curseur parcouru, shares écartés par le filtre compris. Tout share correspondant au filtre
        jusqu'à ce curseur a déjà été envoyé: un client peut le persister comme curseur de reprise même s'il n'a
        reçu aucun share (utile avec un filtre qui ne reçoit que rarement).

      Codes de fermeture:
      - 4400 paramètre invalide (curseur: format ou epoch inconnue; address/workername: vide)
      - 4408 client trop lent (buffer borné plein): se reconnecter avec le dernier curseur reçu
      - 4410 curseur hors rétention (plus ancien que le plus ancien seq disponible; équivalent d'un 410): repartir sans `from`
      - 1013 trop de clients connectés
    parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          pattern: '^\d+:\d+$'
          example: "1:123456"
      - name: address
        in: query
        required: false
        description: Ne diffuse que les shares de ce username (sensible à la casse).
        schema:
          type: string
          minLength: 1
          example: "bc1quser"
      - name: workername
        in: query
        required: false
        description: Ne diffuse que les shares de ce worker (insensible à la casse).
        schema:
          type: string
          minLength: 1
          example: "rig1"
