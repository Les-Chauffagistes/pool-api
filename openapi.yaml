openapi: 3.0.0
info:
  title: Les Chauffagistes mining pool API
  version: 1.0.0
  description: API Les Chauffagistes pour accéder aux métriques de minage
tags:
  - name: health
  - name: pool

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
  /v1/pool:
    get:
      operationId: getPool
      tags: [pool]
      summary: Pool metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/Pool"
  /v1/node:
    get:
      operationId: getNode
      tags: [pool]
      summary: Node metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/Node"
  /v1/stats/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUserStats
      tags: [pool]
      summary: User stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./vendor/chauff-cmn.yaml#/components/schemas/PoolStats"
        "404":
          description: Adresse introuvable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: Adresse introuvable
